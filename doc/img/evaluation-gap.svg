<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">What the deployed model measures on recent images</title>
  <desc id="d">On 3,756 recent ISIC melanomas and 4,000 benign moles at threshold 0.50: sensitivity 0.3506 against a target of 0.85, not met; specificity 0.9667 against a target of 0.80, met; AUC-ROC 0.8279 against a target of 0.90, not met. The earlier accuracy of 0.9422 came from an original split that is not recorded.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2328}.mut{fill:#59636e}
    .track{fill:#eaeef2}.done{fill:#1a7f37}.miss{fill:#cf222e}
    .tick{stroke:#1f2328;stroke-width:2}
    .lbl{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .val{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace}
    .note{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .hd{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9198a1}
      .track{fill:#21262d}.done{fill:#3fb950}.miss{fill:#f85149}
      .tick{stroke:#e6edf3}
    }
  </style>
  <rect class="bg" width="720" height="300" rx="6"/>
  <text class="hd fg" x="24" y="34">What the deployed model measures on recent images</text>
  <text class="note mut" x="24" y="56">Xception, deployed. 3,756 recent melanomas and 4,000 benign moles, threshold 0.50. Tick = target.</text>

  <g transform="translate(24,86)">
    <text class="lbl fg" x="0" y="12">Sensitivity</text>
    <rect class="track" x="200" y="0" width="330" height="16" rx="8"/>
    <rect class="miss"  x="200" y="0" width="116" height="16" rx="8"/>
    <line class="tick"  x1="480.5" y1="-4" x2="480.5" y2="20"/>
    <text class="val fg" x="544" y="13">0.3506</text>
    <text class="note mut" x="200" y="34">not met · target ≥ 0.85 — missing a melanoma is the harmful failure</text>
  </g>

  <g transform="translate(24,142)">
    <text class="lbl fg" x="0" y="12">Specificity</text>
    <rect class="track" x="200" y="0" width="330" height="16" rx="8"/>
    <rect class="done"  x="200" y="0" width="319" height="16" rx="8"/>
    <line class="tick"  x1="464" y1="-4" x2="464" y2="20"/>
    <text class="val fg" x="544" y="13">0.9667</text>
    <text class="note mut" x="200" y="34">met · target ≥ 0.80</text>
  </g>

  <g transform="translate(24,198)">
    <text class="lbl fg" x="0" y="12">AUC-ROC</text>
    <rect class="track" x="200" y="0" width="330" height="16" rx="8"/>
    <rect class="miss"  x="200" y="0" width="273" height="16" rx="8"/>
    <line class="tick"  x1="497" y1="-4" x2="497" y2="20"/>
    <text class="val fg" x="544" y="13">0.8279</text>
    <text class="note mut" x="200" y="34">not met · target ≥ 0.90 — does not depend on the threshold</text>
  </g>

  <text class="note mut" x="24" y="276">The earlier 0.9422 is accuracy on an original split that is not recorded. Full results: doc/measured-metrics.md</text>
</svg>
