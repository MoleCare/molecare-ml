name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach real skin photographs, account details, or tokens.**
        Issues here are public. A drawing, a stock photo, or a description of
        what the picture showed is enough for us to reproduce most things.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run '...'
        2. Send request '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, language/runtime version, and how you are running the project.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste any relevant output. Redact any credentials first.
      render: shell
