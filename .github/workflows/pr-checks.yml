# Safety checks for incoming pull requests, including those from forks.
#
# Deliberately uses `pull_request`, NOT `pull_request_target`. `pull_request`
# runs fork code with NO access to repository secrets and a read-only token.
# `pull_request_target` would run it against the base branch WITH secrets —
# the "pwn request" pattern that has leaked credentials from major projects.
# Never change this trigger.

name: PR Safety Checks

on:
  pull_request:
    branches: [main, develop]

# Least privilege: nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # gitleaks needs history to scan the full diff
      # Uses the gitleaks CLI, not gitleaks-action. The action requires a paid
      # licence for repositories owned by an organisation ("[MoleCare] is an
      # organization. License key is required."), which fails every PR. The CLI
      # is MIT-licensed and free, and `detect` still scans the full git history
      # -- which is the point, given this repo once carried a key in history.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --source . --redact --verbose --exit-code 1

  no-sensitive-data:
    name: Sensitive data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Block credential and key files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD")
          echo "Files changed:"; echo "$FILES" | sed 's/^/  /'

          BAD=$(echo "$FILES" | grep -iE '\.(pem|key|p12|pfx)$|service-account.*\.json$|kaggle\.json$|(^|/)\.env' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Credential or key files must never be committed:"
            echo "$BAD" | sed 's/^/  /'
            exit 1
          fi
          echo "No credential file paths in this pull request."

      - name: Warn on notebook output images
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          NBS=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" | grep '\.ipynb$' || true)
          if [ -z "$NBS" ]; then echo "No notebooks changed."; exit 0; fi
          FOUND=0
          for nb in $NBS; do
            n=$(python3 -c 'import json,sys; nb=json.load(open(sys.argv[1],encoding="utf-8")); print(sum(1 for c in nb.get("cells",[]) for o in c.get("outputs",[]) for k in (o.get("data") or {}) if k.startswith("image/")))' "$nb" 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "::warning file=$nb::Contains $n embedded output image(s). A maintainer must confirm these are plots, not patient or user data."
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then echo "Notebook outputs present - flagged for maintainer review."; else echo "No embedded notebook output images."; fi

      - name: Block embedded base64 blobs
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAIL=0
          for f in $(git diff --name-only --diff-filter=AM "$BASE" "$HEAD"); do
            [ -f "$f" ] || continue
            case "$f" in *.ipynb|*.lock|package-lock.json|*.svg) continue;; esac
            # A long unbroken base64 run in source is almost always an embedded
            # binary. A patient photo reached this repository exactly this way,
            # as a data: URI inside a .py test fixture, and passed every other
            # check here because the filename looked ordinary.
            if grep -qE '[A-Za-z0-9+/]{512,}={0,2}' "$f"; then
              echo "::error file=$f::Long base64 blob detected. Do not embed binaries or images in source - generate fixtures at runtime, or attach large assets to a Release."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "No embedded base64 blobs." || exit 1

      - name: Block oversized files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAIL=0
          for f in $(git diff --name-only --diff-filter=AM "$BASE" "$HEAD"); do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f")
            if [ "$sz" -gt 5242880 ]; then
              echo "::error file=$f::$((sz/1048576))MB exceeds the 5MB limit. Publish model weights via GitHub Releases instead."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "No oversized files." || exit 1

  lint:
    name: Lint and hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Must match the interpreter the container targets. TensorFlow ships
          # no wheels beyond cp313, so bumping this needs a TensorFlow bump too.
          python-version: '3.12'
          cache: pip

      - name: Install from the lock file
        # The lock, not requirements.txt: it is what the images and the deploy
        # job install, so it is what CI must exercise. tf-keras being present
        # in requirements.txt but absent from the lock is precisely the class
        # of drift this catches.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify the lock satisfies requirements.txt
        run: |
          pip install uv
          # Seed the output with the current lock. uv, like pip-tools, keeps
          # pins it can already see and only moves what requirements.txt or
          # constraints.txt force it to move.
          #
          # Compiling to an empty path instead resolves every transitive
          # dependency to whatever is newest that day, so this step failed on
          # main whenever anything upstream published a release — nothing to do
          # with the lock being wrong. Finding an available upgrade is
          # Dependabot's job, not this check's.
          cp requirements.lock /tmp/expected.lock
          uv pip compile requirements.txt -c constraints.txt \
            --python-version 3.12 --universal --no-header -o /tmp/expected.lock
          if ! diff -q requirements.lock /tmp/expected.lock >/dev/null; then
            echo "::error::requirements.lock does not satisfy requirements.txt. Regenerate it:"
            echo "  uv pip compile requirements.txt -c constraints.txt -o requirements.lock --python-version 3.12 --universal --no-header"
            diff requirements.lock /tmp/expected.lock | head -40
            exit 1
          fi
          echo "Lock file satisfies requirements.txt."

      - name: Run tests
        # Model-dependent tests skip cleanly when cnn-models/ is absent, so this
        # does not need the weights downloaded.
        # pytest collects both the unittest.TestCase classes and the
        # function-style tests (api contract, CORS, score polarity). unittest
        # discover silently ran only the former: about 40 tests never executed.
        run: python -m pytest tests -v -p no:cacheprovider

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the serving image
        # Catches base-image and dependency-resolution breakage on the surface
        # that actually ships. A python:3.14 bump reached main because nothing
        # here built the image.
        run: docker build -f deploy/Dockerfile.web -t molecare-ml:pr .
