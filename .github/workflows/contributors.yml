name: Contributors

# Fills the README markers from the GitHub contributors API (commit order, bots
# omitted). Names and counts are never hardcoded — a stale hand-written list is
# worse than none.
#
# Does not open a pull request. A protected default branch refuses both a
# GITHUB_TOKEN push and "Actions may create pull requests", so this writes only
# on a same-repo pull request branch, or on workflow_dispatch of a
# non-default branch.
#
# No `push` trigger on purpose. With both push and pull_request the two runs
# share a concurrency group, so one cancels the other and every pull request is
# left showing a cancelled check that reads like a failure.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Fill README contributors
        uses: YauhenBichel/readme-contributors@ad89c96e4f83262c40804087ffafcfe0e08ade06 # v1.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: html

      - name: Push the list on a writable branch
        if: >-
          github.event.repository.default_branch != (github.head_ref || github.ref_name)
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/contributors.svg .github/faces
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh README contributors"
          git push
