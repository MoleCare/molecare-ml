name: Contributors

# The wall lives in readme-contributors as a reusable workflow and is written
# straight to main after every merge, with no separate pull request.
#
# It used to run on pull requests and push the refreshed wall to the PR
# branch. That loses people: a fork's pull request cannot run it, and a
# same-repository PR lands a wall computed before whatever merged ahead of it.
# MoleCare/molecare-mcp lost a contributor that way, in 44 seconds. A run on
# main after the merge sees every commit.
#
# main is protected, so the wall pushes through the write deploy key stored as
# CONTRIBUTORS_DEPLOY_KEY, the one bypass actor on the ruleset besides the
# owner.
#
# The key is passed by name, not with `secrets: inherit`: inherit only reaches
# a reusable workflow in the same organisation, and the wall lives under
# YauhenBichel, so inherit passed nothing and the push fell back to the
# workflow token, which the protected branch refuses.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wall:
    uses: YauhenBichel/readme-contributors/.github/workflows/wall.yml@6102d1fa62437f9f04020fe53627d503ac3dd26e # v1.9.1
    with:
      format: html
    secrets:
      CONTRIBUTORS_DEPLOY_KEY: ${{ secrets.CONTRIBUTORS_DEPLOY_KEY }}
